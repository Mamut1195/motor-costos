name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -e ".[test]"
      - run: python -m pytest
      # The engine promises the same result on any platform. A single-OS matrix cannot
      # show that, so this runs on both — the one place a determinism claim is cheap to
      # actually test rather than assert.
      - run: python -m motor_costos.schemas
      - name: Schemas must be byte-identical after regeneration
        run: git diff --exit-code -- schemas/
