name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -e ".[test,lint]"
      # Before the suite: linting is cheap and its feedback should not wait behind it.
      - run: python -m ruff check --output-format github .
      # `--cov` is passed here rather than in addopts so a local `pytest` stays
      # fast, while the number that gets quoted is one the build can fail on.
      - run: python -m pytest --cov=motor_costos
      # The engine promises the same result on any platform. A single-OS matrix cannot
      # show that, so this runs on both — the one place a determinism claim is cheap to
      # actually test rather than assert.
      - run: python -m motor_costos.schemas
      - name: Schemas must be byte-identical after regeneration
        run: git diff --exit-code -- schemas/
      # `tests/test_packaging.py` pins the claim; this pins the artifact. A file can sit
      # in the repository and never reach the package a consumer installs, which is
      # exactly how `Typing :: Typed` came to be declared without a usable marker. This
      # is also the only step that builds the distribution at all.
      - name: The built wheel must carry the PEP 561 marker
        run: |
          python -m pip wheel . -w dist --no-deps
          python -c "import glob, sys, zipfile; names = zipfile.ZipFile(glob.glob('dist/*.whl')[0]).namelist(); sys.exit(0 if 'motor_costos/py.typed' in names else 'py.typed is missing from the built wheel: ' + str(names))"
